<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'">
<title>Insight オフライン</title>
<link rel="stylesheet" href="./offline.css">
<script src="./vendor/chart.umd.min.js" integrity="sha512-CQBWl4fJHWbryGE+Pc7UAxWMUMNMWzWxF4SQo9CgkJIN1kx6djDQZjh3Y8SZ1d+6I+1zze6Z7kHXO7q3UyZAWw==" defer></script>
<script src="../insight_indexeddb_storage_v1.js" defer></script>
<script src="./viewer.js" defer></script>
</head>
<body>
<main>
  <h1>Insight オフライン</h1>
  <p id="offline-status" role="status">オフライン閲覧を準備しています。</p>
  <section id="offline-data" hidden aria-label="保存済み実績">
    <div class="filters">
      <label>店舗 <select id="offline-store"></select></label>
      <label>年月 <select id="offline-month"></select></label>
    </div>
    <div class="table-scroll">
      <table>
        <caption>日別実績</caption>
        <thead><tr><th scope="col">日</th><th scope="col">売上（千円）</th><th scope="col">客数（人）</th><th scope="col">廃棄（円）</th><th scope="col">天気</th></tr></thead>
        <tbody id="offline-rows"></tbody>
      </table>
    </div>
    <canvas id="offline-sales" role="img" aria-label="日別売上の推移（千円）"></canvas>
  </section>
  <p><a href="../Index.html">通常のInsightを開く</a></p>
</main>
</body>
</html>
