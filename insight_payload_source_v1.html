<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>

<!-- PWA: ホーム画面に追加 -->
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Insight"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="theme-color" content="#1a1a1a"/>
<meta name="description" content="コンビニ経営ダッシュボード — 売上・客数・廃棄を管理"/>

<!-- Manifest -->
<link rel="manifest" id="manifestLink"/>

<!-- Apple Touch Icons (SVG → data URI) -->
<link rel="apple-touch-icon" sizes="180x180" id="appleIcon180"/>
<link rel="apple-touch-icon" sizes="152x152" id="appleIcon152"/>
<link rel="icon" type="image/svg+xml" id="favicon"/>

<!-- iPad スプラッシュスクリーン -->
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>

<title>Insight</title>
<link rel="stylesheet" href="./insight_payload_core_v1.css?v=20261006-annual-summary-css-1">
</head>
<body>
<div id="app">
  <div id="sidebar">
    <h1>Insight</h1>
    <!-- 店舗セレクター -->
    <div class="store-sel-wrap">
      <select id="storeSel" class="store-sel"></select>
      <button class="store-menu-btn" id="storeMenuBtn">⋯</button>
    </div>
    <div id="storeMenu" class="store-menu"></div>
    <div class="nav-list">
      <button class="nav-btn quick active" id="nav0">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>今日の入力
        <span class="today-badge" id="todayBadge">今日</span>
      </button>
      <button class="nav-btn" id="nav1">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>ダッシュボード</button>
      <button class="nav-btn" id="nav2">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2"/><path d="M6 12h.01M18 12h.01"/></svg>売上入力</button>
      <button class="nav-btn" id="nav3">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>客数入力</button>
      <button class="nav-btn" id="nav4">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l2-1.14"/><path d="m7.5 4.27 9 5.15"/><polyline points="3.29 7 12 12 20.71 7"/><line x1="12" y1="22" x2="12" y2="12"/><path d="m17 13 5 5m-5 0 5-5"/></svg>廃棄入力</button>
    </div>
    <div class="sidebar-btns">
      <button id="backupBtn" class="sidebar-btn">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="12" x2="2" y2="12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/><line x1="6" y1="16" x2="6.01" y2="16"/><line x1="10" y1="16" x2="10.01" y2="16"/></svg>
        <div class="sidebar-btn-text">
          <span>バックアップ</span>
          <span id="backupDaysLabel" class="sidebar-btn-sub"></span>
        </div>
      </button>
      <button id="restoreBtn" class="sidebar-btn">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
        <span>データ復元</span>
      </button>
      <button id="darkModeBtn" class="sidebar-btn">
        <svg class="nav-icon" id="darkModeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
        <span id="darkModeLabel">ダークモード</span>
      </button>
      <button id="csvImportBtn" class="sidebar-btn">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="16" y2="17"/><line x1="8" y1="9" x2="10" y2="9"/></svg>
        <span>CSVインポート</span>
      </button>
      <input type="file" id="restoreFile" accept=".json">
      <input type="file" id="csvImportFile" accept=".csv">
    </div>
  </div>

  <div id="main">

    <!-- ══ クイック入力 ══ -->
    <div class="page show quick-page" id="pageQuick">
      <div class="quick-date-bar">
        <div>
          <div class="quick-date" id="qDate"></div>
        </div>
        <div class="quick-weekday" id="qWeekday"></div>
        <div class="weather-sel" id="qWeatherSel">
          <button class="wx-btn active" data-wx="快晴" >☀️</button>
          <button class="wx-btn" data-wx="晴" >🌤️</button>
          <button class="wx-btn" data-wx="晴曇" >⛅</button>
          <button class="wx-btn" data-wx="曇" >☁️</button>
          <button class="wx-btn" data-wx="小雨" >🌦️</button>
          <button class="wx-btn" data-wx="雨" >🌧️</button>
          <button class="wx-btn" data-wx="大雨" >⛈️</button>
          <button class="wx-btn" data-wx="みぞれ" >🌨️</button>
          <button class="wx-btn" data-wx="雪" >❄️</button>
        </div>
        <button id="autoWxBtn">
          <span>📡</span><span id="autoWxLabel">自動取得</span>
        </button>
        <div id="qNavRow" class="quick-nav-row"></div>
      </div>
      <div class="quick-grid" id="quickGrid"></div>
      <div class="payload-quick-actions">
        <button id="quickClearBtn" class="clear-btn quick-clear">クリア</button>
        <button id="quickSaveBtn" class="quick-save">保存する</button>
      </div>
    </div>

    <!-- ══ Dashboard ══ -->
    <div class="page" id="pageDash">
      <div class="page-header">
        <div class="page-title">売上分析ダッシュボード</div>
      </div>
      <div class="year-bar">
        <div class="year-sel-group">
          <span class="year-sel-label">基準年</span>
          <select id="baseYearSel"></select>
        </div>
        <span class="payload-year-vs">vs</span>
        <div class="year-sel-group">
          <span class="year-sel-label">比較年</span>
          <select id="cmpYearSel"></select>
        </div>
        <button id="addYearBtn">＋ 年度追加</button>
        <div id="addYearInlineWrap"></div>
      </div>
      <div class="dash-month-bar">
        <div class="dash-month-scroll">
          <div class="month-btns" id="dashMonthBtns"></div>
        </div>
      </div>
      <div class="kpi-row-wrap">
        <div class="kpi-row" id="kpiRow"></div>
      </div>
      <div class="charts-row">
        <div class="chart-left-col">
          <div class="card main-chart-card">
            <div class="chart-hd">
              <div>
                <div class="chart-title" id="chartTitle">月次推移</div>
                <div class="chart-sub" id="chartSub"></div>
              </div>
              <div class="chart-controls">
                <button class="tab-btn" id="tabDay">日別</button>
                <button class="tab-btn active" id="tabMonth">月別</button>
              </div>
            </div>
            <div class="legend-row" id="legendRow"></div>
            <div class="chart-wrap"><canvas id="mainChart"></canvas></div>
          </div>
        </div><!-- /chart-left-col -->
        <div class="right-col">
          <div class="card donut-card">
            <div class="payload-donut-head">
              <div><div class="chart-title">廃棄内訳</div><div class="chart-sub" id="donutSub">月合計</div></div>
              <div class="payload-donut-tools">
                <div class="payload-donut-toggle">
                  <button id="donutBtnAmt">金額</button>
                  <button id="donutBtnPct">割合</button>
                </div>
                <div id="donutDayPicker">
                  <select id="donutDaySelect"></select>
                </div>
              </div>
            </div>
            <div class="donut-inner">
              <div class="donut-wrap"><canvas id="donutChart"></canvas></div>
              <div class="donut-legends" id="donutLegends"></div>
            </div>
          </div>
          <!-- 曜日別分析 -->
          <div class="card corr-card" id="corrRow">
            <div class="payload-corr-head">
              <div class="chart-title">曜日別平均売上</div>
              <div class="payload-wd-toggle">
                <button class="wd-period-btn active" data-months="1">1ヶ月</button>
                <button class="wd-period-btn" data-months="3">3ヶ月</button>
                <button class="wd-period-btn" data-months="6">6ヶ月</button>
              </div>
            </div>
            <div class="payload-wd-chart-wrap"><canvas id="wdChart"></canvas></div>
          </div>
          <div class="card summary-card">
            <div class="summary-title">年間サマリー</div>
            <div id="summaryBody"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- ══ 売上入力 ══ -->
    <div class="page input-pg" id="pageSales">
      <div class="page-header">
        <div class="page-title">売上入力</div>
        <div class="header-right">
          <div class="saved-msg" id="savedSales">✓ 保存しました</div>
          <button id="salesClearBtn" class="clear-btn">クリア</button>
          <button id="salesSaveBtn" class="save-btn">保存する</button>
        </div>
      </div>
      <div class="input-year-row" id="salesYearRow"></div>
      <div class="month-tab-row" id="salesMonthTabs"></div>
      <div class="payload-input-chart-row">
        <div class="haiki-chart-card payload-input-chart-main" id="salesChartCard">
          <div class="haiki-chart-header">
            <div>
              <div class="haiki-chart-title" id="salesChartTitle">売上 日別推移</div>
              <div class="haiki-chart-sub" id="salesChartSub"></div>
            </div>
            <div class="haiki-chart-total" id="salesChartTotal"></div>
          </div>
          <div class="payload-input-chart-main-wrap">
            <canvas id="salesLineChart"></canvas>
          </div>
        </div>
        <div class="haiki-chart-card payload-input-chart-side">
          <div class="haiki-chart-title">曜日別平均売上</div>
          <div class="payload-input-chart-side-wrap">
            <canvas id="salesWdChart"></canvas>
          </div>
        </div>
      </div>
      <div class="table-card">
        <div class="haiki-pane">
          <div class="haiki-day-list" id="salesDayList"></div>
          <div class="haiki-form" id="salesForm"></div>
        </div>
      </div>
    </div>

    <!-- ══ 客数入力 ══ -->
    <div class="page input-pg" id="pageKyaku">
      <div class="page-header">
        <div class="page-title">客数入力</div>
        <div class="header-right">
          <div class="saved-msg" id="savedKyaku">✓ 保存しました</div>
          <button id="kyakuClearBtn" class="clear-btn">クリア</button>
          <button id="kyakuSaveBtn" class="save-btn">保存する</button>
        </div>
      </div>
      <div class="input-year-row" id="kyakuYearRow"></div>
      <div class="month-tab-row" id="kyakuMonthTabs"></div>
      <div class="payload-input-chart-row">
        <div class="haiki-chart-card payload-input-chart-main" id="kyakuChartCard">
          <div class="haiki-chart-header">
            <div>
              <div class="haiki-chart-title" id="kyakuChartTitle">客数 日別推移</div>
              <div class="haiki-chart-sub" id="kyakuChartSub"></div>
            </div>
            <div class="haiki-chart-total" id="kyakuChartTotal"></div>
          </div>
          <div class="payload-input-chart-main-wrap">
            <canvas id="kyakuLineChart"></canvas>
          </div>
        </div>
        <div class="haiki-chart-card payload-input-chart-side">
          <div class="haiki-chart-title">曜日別平均客数</div>
          <div class="payload-input-chart-side-wrap">
            <canvas id="kyakuWdChart"></canvas>
          </div>
        </div>
      </div>
      <div class="kyaku-grid-wrap" id="kyakuGridWrap">
        <div class="kyaku-month-total" id="kyakuMonthTotal"></div>
        <div class="kyaku-grid" id="kyakuGrid"></div>
      </div>
    </div>

    <!-- ══ 廃棄入力 ══ -->
    <div class="page input-pg" id="pageHaiki">
      <div class="page-header">
        <div class="page-title">廃棄入力</div>
        <div class="header-right">
          <div class="saved-msg" id="savedHaiki">✓ 保存しました</div>
          <button id="haikiClearBtn" class="clear-btn">クリア</button>
          <button id="haikiSaveBtn" class="save-btn">保存する</button>
        </div>
      </div>
      <div class="input-year-row" id="haikiYearRow"></div>
      <div class="month-tab-row" id="haikiMonthTabs"></div>
      <div class="payload-input-chart-row">
        <div class="haiki-chart-card payload-input-chart-main" id="haikiChartCard">
          <div class="haiki-chart-header">
            <div>
              <div class="haiki-chart-title" id="haikiChartTitle">廃棄金額 日別推移</div>
              <div class="haiki-chart-sub" id="haikiChartSub"></div>
            </div>
            <div class="haiki-chart-total" id="haikiChartTotal"></div>
          </div>
          <div class="payload-input-chart-main-wrap">
            <canvas id="haikiBarChart"></canvas>
          </div>
        </div>
        <div class="haiki-chart-card payload-input-chart-side">
          <div class="haiki-chart-title">曜日別平均廃棄</div>
          <div class="payload-input-chart-side-wrap">
            <canvas id="haikiWdChart"></canvas>
          </div>
        </div>
      </div>
      <div class="table-card">
        <div class="haiki-pane">
          <div class="haiki-day-list" id="haikiDayList"></div>
          <div class="haiki-form" id="haikiForm"></div>
        </div>
      </div>
    </div>

  </div>
</div>

<div class="budget-modal-bg" id="budgetModalBg">
  <div class="budget-modal">
    <div class="budget-modal-title">廃棄予算の設定</div>
    <div id="budgetEditRows"></div>
    <div class="budget-modal-btns">
      <button id="budgetCancelBtn" class="budget-modal-cancel">キャンセル</button>
      <button id="budgetSaveBtn" class="budget-modal-save">保存する</button>
    </div>
  </div>
</div>

<div class="modal-bg" id="modalBg">
  <div class="modal">
    <h2>年度を削除しますか？</h2>
    <p id="modalMsg"></p>
    <div class="modal-btns">
      <button id="yearDeleteCancelBtn" class="modal-btn cancel">キャンセル</button>
      <button id="yearDeleteConfirmBtn" class="modal-btn danger">削除する</button>
    </div>
  </div>
</div>

<script src="./insight_payload_core_v1.js?v=20261006-payload-assets-1"></script>


<!-- Split View 経営分析AIパネル（既存画面から独立） -->
<button id="aiAnalysisToggle" class="ai-analysis-toggle" type="button" aria-controls="aiAnalysisPanel" aria-expanded="false">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a5 5 0 0 0-4.6 3H7a4 4 0 0 0-1 7.87V14a4 4 0 0 0 4 4h1v3"/><path d="M12 3a5 5 0 0 1 4.6 3h.4a4 4 0 0 1 1 7.87V14a4 4 0 0 1-4 4h-1v3"/><path d="M9 9h.01M15 9h.01M9 14c1.5 1 4.5 1 6 0"/></svg>
  経営分析AI
</button>
<aside id="aiAnalysisPanel" class="ai-analysis-panel" aria-hidden="true" aria-label="経営分析AI">
  <div class="ai-analysis-head">
    <div>
      <div class="ai-analysis-title">経営分析AI</div>
      <div class="ai-analysis-subtitle">KPI・前年比較から生成した経営コメント</div>
    </div>
    <button id="aiAnalysisClose" class="ai-analysis-close" type="button" aria-label="閉じる">×</button>
  </div>
  <div class="ai-analysis-body">
    <div id="aiAnalysisPeriod" class="ai-analysis-period"></div>
    <div class="ai-analysis-card">
      <div class="ai-analysis-card-title">経営コメント</div>
      <div id="aiAnalysisComments"></div>
    </div>
  </div>
  <div class="ai-analysis-foot">このパネルは既存のKPI計算・前年比較・経営コメント生成結果を表示します。</div>
</aside>

<script src="./insight_payload_ai_legacy_v1.js?v=20261006-payload-assets-1"></script>
<script src="./insight_payload_bindings_v1.js?v=20261006-inline-bindings-1"></script>
</body>
</html>
