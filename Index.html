<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1a1a1a">
<title>Insight</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.es5.min.js"></script>
<style>
html,body{margin:0;width:100%;height:100%;background:#eef0f5;font-family:-apple-system,'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif}
#loading{height:100%;display:flex;align-items:center;justify-content:center;color:#666;font-size:14px}
</style>
</head>
<body>
<div id="loading">Insightを読み込んでいます…</div>
<script>
(function(){
  var files=[
    'insight_payload_v1_part01a.txt',
    'insight_payload_v1_part01b.txt',
    'insight_payload_v1_part02.txt',
    'insight_payload_v1_part03.txt',
    'insight_payload_v1_part04a.txt',
    'insight_payload_v1_part04b.txt',
    'insight_payload_v1_part05.txt',
    'insight_payload_v1_part06.txt',
    'insight_payload_v1_part07.txt'
  ];
  function fail(e){
    document.body.innerHTML='<div style="padding:24px;font-family:-apple-system,sans-serif;color:#b42318">Insightの読み込みに失敗しました。<br><small>'+String(e&&e.message?e.message:e)+'</small></div>';
  }
  if(typeof pako==='undefined'){
    fail(new Error('展開ライブラリを読み込めませんでした'));
    return;
  }
  Promise.all(files.map(function(file){
    return fetch('./'+file+'?v=20260905-2',{cache:'no-store'}).then(function(r){
      if(!r.ok)throw new Error(file+' の取得に失敗しました ('+r.status+')');
      return r.text();
    });
  })).then(function(parts){
    var b64=parts.join('').replace(/\s/g,'');
    var bin=atob(b64);
    var bytes=new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
    var html=pako.ungzip(bytes,{to:'string'});
    if(html.indexOf('<!DOCTYPE html>')!==0&&html.indexOf('<!doctype html>')!==0){
      throw new Error('HTMLデータの検証に失敗しました');
    }

    /* 経営分析AIボタンの表示だけを変更 */
    html=html.replace('background:var(--surface);color:var(--text);box-shadow:0 6px 24px var(--shadow);','background:#1a1a1a;color:#fff;box-shadow:0 6px 24px var(--shadow);');
    html=html.replace('.ai-analysis-toggle svg{width:17px;height:17px;flex:none;}','.dark .ai-analysis-toggle{background:#fff;color:#1a1a1a;}');
    html=html.replace(/(<button id="aiAnalysisToggle"[\s\S]*?>)\s*<svg[\s\S]*?<\/svg>\s*経営分析AI/,'$1\n  経営分析AI');
    html=html.replace('position:fixed;right:18px;bottom:18px;z-index:10020;','position:fixed;right:18px;bottom:96px;z-index:10020;');
    html=html.replace('.ai-analysis-toggle{right:12px;bottom:12px;}','.ai-analysis-toggle{right:12px;bottom:90px;}');

    /* Split View方式をオーバーレイ方式へ変更 */
    html=html.replace('body.ai-analysis-open #main{margin-right:390px;}\nbody.ai-analysis-open .ai-analysis-toggle{display:none;}','body.ai-analysis-open .ai-analysis-toggle{display:none;}\n.ai-analysis-backdrop{position:fixed;inset:0;z-index:10000;background:rgba(142,142,147,.18);opacity:0;pointer-events:none;transition:opacity .24s ease;}\nbody.ai-analysis-open .ai-analysis-backdrop{opacity:1;pointer-events:auto;}');
    html=html.replace('  body.ai-analysis-open #main{margin-right:0;}\n','');
    html=html.replace('<aside id="aiAnalysisPanel" class="ai-analysis-panel" aria-hidden="true" aria-label="経営分析AI">','<div id="aiAnalysisBackdrop" class="ai-analysis-backdrop" hidden aria-hidden="true" onclick="closeAIAnalysisPanel()"></div>\n<aside id="aiAnalysisPanel" class="ai-analysis-panel" aria-hidden="true" aria-label="経営分析AI">');
    html=html.replace("function openAIAnalysisPanel(){\n  renderAIAnalysisPanel();\n  document.body.classList.add('ai-analysis-open');\n  const panel=document.getElementById('aiAnalysisPanel');\n  const toggle=document.getElementById('aiAnalysisToggle');\n  if(panel)panel.setAttribute('aria-hidden','false');\n  if(toggle)toggle.setAttribute('aria-expanded','true');\n}","function openAIAnalysisPanel(){\n  renderAIAnalysisPanel();\n  document.body.classList.add('ai-analysis-open');\n  const panel=document.getElementById('aiAnalysisPanel');\n  const toggle=document.getElementById('aiAnalysisToggle');\n  const backdrop=document.getElementById('aiAnalysisBackdrop');\n  if(panel)panel.setAttribute('aria-hidden','false');\n  if(toggle)toggle.setAttribute('aria-expanded','true');\n  if(backdrop){backdrop.hidden=false;backdrop.setAttribute('aria-hidden','false');}\n}");
    html=html.replace("function closeAIAnalysisPanel(){\n  document.body.classList.remove('ai-analysis-open');\n  const panel=document.getElementById('aiAnalysisPanel');\n  const toggle=document.getElementById('aiAnalysisToggle');\n  if(panel)panel.setAttribute('aria-hidden','true');\n  if(toggle)toggle.setAttribute('aria-expanded','false');\n}","function closeAIAnalysisPanel(){\n  document.body.classList.remove('ai-analysis-open');\n  const panel=document.getElementById('aiAnalysisPanel');\n  const toggle=document.getElementById('aiAnalysisToggle');\n  const backdrop=document.getElementById('aiAnalysisBackdrop');\n  if(panel)panel.setAttribute('aria-hidden','true');\n  if(toggle)toggle.setAttribute('aria-expanded','false');\n  if(backdrop){backdrop.setAttribute('aria-hidden','true');backdrop.hidden=true;}\n}");

    /* iPad Slide Over風デザインへ変更 */
    html=html.replace(
      'position:fixed;top:0;right:0;bottom:0;z-index:10010;\n  width:390px;max-width:42vw;background:var(--surface);color:var(--text);\n  border-left:1px solid var(--border);box-shadow:-8px 0 28px var(--shadow);',
      'position:fixed;top:14px;right:14px;bottom:14px;z-index:10010;\n  width:390px;max-width:42vw;background:#f2f2f7;color:#1a1a1a;\n  --surface:#f2f2f7;--surface2:#fff;--border:#d1d1d6;--text:#1a1a1a;--text2:#3a3a3c;--text3:#636366;--text4:#8e8e93;--text5:#aeaeb2;\n  border:1px solid rgba(60,60,67,.16);border-radius:24px;box-shadow:0 14px 44px rgba(0,0,0,.22);'
    );
    html=html.replace(
      '  .ai-analysis-panel{width:min(390px,88vw);max-width:none;}',
      '  .ai-analysis-panel{width:min(390px,88vw);max-width:none;top:12px;right:12px;bottom:12px;border-radius:22px;}'
    );
    html=html.replace(
      '  .ai-analysis-panel{width:92vw;}',
      '  .ai-analysis-panel{width:calc(100vw - 24px);max-width:none;top:12px;right:12px;bottom:12px;border-radius:22px;}'
    );

    document.open();
    document.write(html);
    document.close();
  }).catch(fail);
})();
</script>
</body>
</html>
