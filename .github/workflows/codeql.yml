name: CodeQL JavaScript security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 1 * * 2'

permissions:
  contents: read
  actions: read
  security-events: write

jobs:
  codeql:
    name: codeql / javascript-typescript
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4 (2026-10-15)
        with:
          languages: javascript-typescript
      - name: Analyze repository
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4 (2026-10-15)
        with:
          category: /language:javascript-typescript
