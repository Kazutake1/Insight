name: Vendor OCR assets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vendor-ocr-assets.yml'

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pinned OCR packages
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/insight-ocr-vendor"
          rm -rf "$work"
          mkdir -p "$work"
          cd "$work"
          npm init -y >/dev/null 2>&1
          npm install --ignore-scripts --no-audit --no-fund --save-exact             tesseract.js@7.0.0             tesseract.js-core@7.0.0             @tesseract.js-data/jpn@1.0.0

      - name: Copy local OCR runtime
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/insight-ocr-vendor/node_modules"
          rm -rf vendor/ocr
          mkdir -p vendor/ocr/lang

          cp "$src/tesseract.js/dist/tesseract.min.js" vendor/ocr/
          cp "$src/tesseract.js/dist/worker.min.js" vendor/ocr/
          cp "$src/tesseract.js-core"/tesseract-core*.wasm.js vendor/ocr/
          cp "$src/@tesseract.js-data/jpn/4.0.0_best_int/jpn.traineddata.gz" vendor/ocr/lang/

          for candidate in LICENSE LICENSE.md; do
            if [ -f "$src/tesseract.js/$candidate" ]; then
              cp "$src/tesseract.js/$candidate" vendor/ocr/LICENSE.tesseract-js.txt
              break
            fi
          done
          for candidate in LICENSE LICENSE.md; do
            if [ -f "$src/tesseract.js-core/$candidate" ]; then
              cp "$src/tesseract.js-core/$candidate" vendor/ocr/LICENSE.tesseract-core.txt
              break
            fi
          done
          for candidate in LICENSE LICENSE.md; do
            if [ -f "$src/@tesseract.js-data/jpn/$candidate" ]; then
              cp "$src/@tesseract.js-data/jpn/$candidate" vendor/ocr/LICENSE.tessdata-jpn.txt
              break
            fi
          done

          cat > vendor/ocr/NOTICE.txt <<'EOF'
Insight local OCR runtime

Pinned packages:
- tesseract.js 7.0.0
- tesseract.js-core 7.0.0
- @tesseract.js-data/jpn 1.0.0 (4.0.0_best_int/jpn.traineddata.gz)

Runtime policy:
- Assets are served from the same Insight origin.
- OCR images are not uploaded to these projects or any external OCR service.
- Tesseract language caching is disabled by Insight so recognized image data and OCR cache are not written to IndexedDB by the OCR integration.
EOF

          find vendor/ocr -type f ! -name SHA256SUMS.txt -print0             | sort -z             | xargs -0 sha256sum > vendor/ocr/SHA256SUMS.txt

      - name: Commit vendored OCR assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vendor/ocr
          if git diff --cached --quiet; then
            echo "OCR assets already match pinned versions."
            exit 0
          fi
          git commit -m "Vendor local OCR runtime assets"
          git push origin HEAD:main
