name: Regression tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test / ${{ matrix.file }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        file:
          - analysis_context.test.cjs
          - comparison_single_source.test.cjs
          - date_context.test.cjs
          - daily_anomaly.test.cjs
          - hook_bridge.test.cjs
          - insight_events.test.cjs
          - insight_sales_count.test.cjs
          - insight_yoy_policy.test.cjs
          - payload_browser_smoke.test.cjs
          - payload_patch_inventory.test.cjs
          - script_load_order.test.cjs
          - security_storage_regression.test.cjs
          - storage_layer.test.cjs
          - weather_future_guard.test.cjs
          - weekly_review.test.cjs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run test file
        shell: bash
        run: |
          set -o pipefail
          node --test "tests/${{ matrix.file }}" 2>&1 | tee test-output.txt
      - name: Upload failed test output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-output-${{ matrix.file }}
          path: test-output.txt
          retention-days: 3
