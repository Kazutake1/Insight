name: Regression tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-prepublish:
    name: security / public asset preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Inspect tracked public assets and secret files
        run: node --test tests/publication_security.test.cjs

  test:
    name: test / ${{ matrix.file }}
    needs: security-prepublish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        file:
          - analysis_context.test.cjs
          - analysis_history.test.cjs
          - ai_context.test.cjs
          - ai_interpretation.test.cjs
          - ai_visual.test.cjs
          - analysis_period_lock.test.cjs
          - bootstrap_patches.test.cjs
          - comparison_single_source.test.cjs
          - date_context.test.cjs
          - data_health.test.cjs
          - daily_anomaly.test.cjs
          - hook_bridge.test.cjs
          - insight_events.test.cjs
          - hourly_customers.test.cjs
          - event_results.test.cjs
          - insight_sales_count.test.cjs
          - trip_inference.test.cjs
          - trip_inference_view.test.cjs
          - trip_overrides.test.cjs
          - trip_history_resolver.test.cjs
          - insight_yoy_policy.test.cjs
          - monthly_review.test.cjs
          - multiyear_analysis.test.cjs
          - weekday_analysis.test.cjs
          - sale_impact.test.cjs
          - event_impact.test.cjs
          - seasonality_analysis.test.cjs
          - anomaly_explanation.test.cjs
          - analysis_bundle.test.cjs
          - dark_theme.test.cjs
          - page_period_sync.test.cjs
          - sales_period_selector.test.cjs
          - payload_browser_smoke.test.cjs
          - payload_patch_inventory.test.cjs
          - sale_results.test.cjs
          - script_load_order.test.cjs
          - security_storage_regression.test.cjs
          - storage_layer.test.cjs
          - weather_future_guard.test.cjs
          - weather_bulk.test.cjs
          - weather_classification.test.cjs
          - weekly_review.test.cjs
          - year_manager.test.cjs
          - order_forecast.test.cjs
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Run test file
        shell: bash
        run: |
          set -o pipefail
          node --test "tests/${{ matrix.file }}" 2>&1 | tee test-output.txt
      - name: Upload failed test output
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-output-${{ matrix.file }}
          path: test-output.txt
          retention-days: 3

  e2e:
    name: browser e2e / chromium
    needs: security-prepublish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install E2E dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser E2E
        run: npm run test:e2e
      - name: Upload E2E artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 3

  e2e-webkit:
    name: browser e2e / webkit smoke
    needs: security-prepublish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install E2E dependencies
        run: npm ci --no-audit --no-fund
      - name: Install WebKit
        run: npx playwright install --with-deps webkit
      - name: Run WebKit smoke E2E
        run: npx playwright test --config=playwright.webkit.config.cjs
      - name: Upload WebKit E2E artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-webkit-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 3


